# Release: agent plugin (Claude Code / Codex) or multi-skill repo
# Trigger: a version bump in .claude-plugin/plugin.json on main.
# Version source of truth: .claude-plugin/plugin.json `version`. The job fails if
# .codex-plugin/plugin.json or any skills/*/SKILL.md `metadata.version` disagrees.
# Then: tag v<version> if missing and create a GitHub release. Notes come from the matching
# CHANGELOG.md section, else from the commit subjects since the previous tag (always via a file).
name: Release

on:
  push:
    branches: ['main']
    paths: [.claude-plugin/plugin.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check ref
        env:
          DEFAULT_BRANCH: 'main'
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            COMMIT=$(git rev-parse "${GITHUB_SHA}^{commit}")
            if ! git merge-base --is-ancestor "$COMMIT" "origin/$DEFAULT_BRANCH"; then
              echo "::error::tag $GITHUB_REF_NAME points to a commit that is not on $DEFAULT_BRANCH"; exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::releases run only from $DEFAULT_BRANCH (got $GITHUB_REF_NAME)"; exit 1
          fi

      - name: Read and cross-check version
        id: v
        run: |
          VERSION=$(jq -r '.version // empty' .claude-plugin/plugin.json)
          if [ -z "$VERSION" ]; then echo "::error::.claude-plugin/plugin.json has no version"; exit 1; fi
          if [ -f .codex-plugin/plugin.json ]; then
            C=$(jq -r '.version // empty' .codex-plugin/plugin.json)
            if [ "$C" != "$VERSION" ]; then echo "::error::.codex-plugin/plugin.json version '$C' != $VERSION"; exit 1; fi
          fi
          for f in skills/*/SKILL.md; do
            [ -f "$f" ] || continue
            S=$(awk '/^---[[:space:]]*$/{n++; next} n==1 && /^[[:space:]]+version:/{sub(/^[[:space:]]+version:[[:space:]]*/, ""); gsub(/["\047]/, ""); print; exit}' "$f")
            if [ -n "$S" ] && [ "$S" != "$VERSION" ]; then echo "::error::$f metadata.version '$S' != $VERSION"; exit 1; fi
          done
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: steps.v.outputs.release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          NOTES="$RUNNER_TEMP/notes.md"
          : > "$NOTES"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              /^## / { if (found) exit; h = $0; sub(/^##[ \t]+/, "", h); gsub(/[][]/, "", h); sub(/^v/, "", h); split(h, w, /[ \t]/); if (w[1] == v) { found = 1; next } }
              found { print }' CHANGELOG.md > "$NOTES"
          fi
          if [ ! -s "$NOTES" ]; then
            PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$PREV" ]; then git log --pretty='- %s' "${PREV}..HEAD" > "$NOTES"; else git log --pretty='- %s' -20 > "$NOTES"; fi
          fi

      - name: Create tag and release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
